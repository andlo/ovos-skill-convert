name: Publish Docker image

# Mirrors publish.yml's own trigger/test-first structure so both
# release artifacts (PyPI package, container image) get built from the
# exact same tagged commit and neither ships without tests passing
# first. Same pattern as ovos-tui-client's companion image workflow.

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ovos-skill-convert:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ovos-skill-convert:latest
